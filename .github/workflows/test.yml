name: Test

on:
  push:
    branches:
      - '**'
  schedule:
    - cron: '0 0 * * MON'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        ruby: ['2.7', '3.0', '3.1', '3.2', '3.3', '3.4', '4.0']

    runs-on: ubuntu-latest
    env:
      BUNDLE_WITHOUT: development
    steps:
    - uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true

    - name: Run Tests
      run: bundle exec rspec
